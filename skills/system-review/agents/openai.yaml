interface:
  display_name: "System Review"
  short_description: "Review cross-part behavior and failure paths"
  default_prompt: "Use $system-review when a material question depends on cross-part contracts, state propagation, or operational failure paths. Treat the skill as a review standard rather than a fixed procedure: use the smallest sufficient boundary and evidence path, establish material contracts and discriminating scenarios, retain only evidence-backed defects with material consequences, record positive closure conditions, and preserve unaffected evidence on re-review. Escalate to independent perspectives only when they could materially change a conclusion."
