routing:
  use_when:
  - Writing or debugging Nevermore Blend UI, Rx pipelines, Brio lifetimes, Nevermore UI Labs stories or loader
    bootstrap/imports in a project pinned to Blend 12.50.2, Rx 13.34.2, Brio 14.37.2 and loader 10.11.3.
  avoid_when:
  - Vide UI, framework selection, or replacing Bootstrapper startup.
  - The project pins different Nevermore package versions; keep those pins and find matching guidance.
guidance:
  claim_scope: advice-only
  shared_usage: references/child-usage.md
  executable_fixture: null
  documents:
  - path: SKILL.md
    roles:
    - routing
    - common-use
    - ownership
    - security
    - verification
    - maintenance
    when: every activated use
  - path: references/setup.md
    roles:
    - setup
    - lifecycle
    when: restoring packages, the shared adapter, loader bootstrap (game, plugin, story) or replication
  - path: references/blend.md
    roles:
    - api
    - recipes
    - lifecycle
    when: composing UI, props/children rules, events, animation or UI Labs story mounts
  - path: references/rx.md
    roles:
    - api
    - lifecycle
    when: building observable pipelines, choosing operators, or adapting signals and promises
  - path: references/brio.md
    roles:
    - api
    - lifecycle
    when: value lifetimes, Brio-owned work or stale async results
  - path: references/troubleshooting.md
    roles:
    - troubleshooting
    when: a loader, replication, construction-failure, Brio or Promise error, or duplicate UI
reconciliation:
  policy: conditional
  reason: exact direct npm declarations and archive-bound locks gate ordinary use; reviewed installed-source
    integrity gates completion
