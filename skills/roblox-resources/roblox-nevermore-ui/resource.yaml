    - common-use
    - ownership
    - security
    - verification
    - maintenance
    when: every activated use
  - path: references/setup.md
    roles:
    - setup
    - lifecycle
    when: restoring packages or changing imports, mapping and loader ownership
  - path: references/blend.md
    roles:
    - api
    - recipes
    - lifecycle
    when: composing UI, properties or preview mounts
  - path: references/rx.md
    roles:
    - api
    - lifecycle
    when: changing observable flow, promise or signal adapters
  - path: references/brio.md
    roles:
    - api
    - lifecycle
    when: changing value-owned work or stale-value handling
  - path: references/troubleshooting.md
    roles:
    - troubleshooting
    when: a matching integration failure or ownership/security defect
reconciliation:
