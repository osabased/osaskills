schema_version: 2
parent_contract:
  name: roblox-resource-acquisition
  version: 2
scope: project
resource:
  slug: rojo-rbx-rojo
  name: Rojo build contract
  canonical_url: https://github.com/rojo-rbx/rojo
  package_id: rojo-rbx/rojo
  selector:
    kind: version
    value: 7.7.0
  source_review_date: '2026-09-30'
  devforum_url: null
routing:
  use_when:
  - An authorized project needs a reproducible CLI build with an independent script-presence
    contract.
  avoid_when:
  - The requested proof needs live Studio synchronization, physics or gameplay execution.
guidance:
  claim_scope: executable-integration
  documents:
  - path: SKILL.md
    roles:
    - api
    - common-use
    - lifecycle
    - maintenance
    - ownership
    - routing
    - security
    - verification
    when: every activated use
  - path: references/setup.md
    roles:
    - setup
    when: installing or changing project bindings
  - path: references/troubleshooting.md
    roles:
    - troubleshooting
    when: diagnosing matching symptoms
  executable_fixture: scripts/smoke_build.py
installation:
  profile: custom
  custom_checker: scripts/check_build.py
