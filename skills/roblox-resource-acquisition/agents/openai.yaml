interface:
  display_name: "Roblox Resource Acquisition"
  short_description: "Find reliable resources and adopt them with reusable skills"
  default_prompt: "Use $roblox-resource-acquisition to proactively choose reliable, maintainable Roblox libraries/modules or development tools and complete acquire/adopt with verification and a reusable user-wide child skill; honor evaluate/compare-only requests, route refresh or repair/reconcile when needed, and keep adoption pending if a required check cannot run."
