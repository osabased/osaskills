schema_version: 1
parent_contract:
  name: roblox-resource-acquisition
  version: 1
scope: project
resource:
  slug: RESOURCE-SLUG
  name: RESOURCE NAME
  canonical_url: https://CANONICAL-SOURCE
  package_id: PACKAGE-ID
  selector:
    kind: version
    value: IMMUTABLE-VERSION
  source_review_date: YYYY-MM-DD
  devforum_url: null
routing:
  use_when:
    - SOURCE-GROUNDED-POSITIVE-TRIGGER
  avoid_when:
    - MATERIAL-ROUTING-EXCLUSION
guidance:
  claim_scope: advice-only
  shared_usage: references/child-usage.md
  documents:
    - path: SKILL.md
      roles: [routing, common-use, ownership, security, verification, maintenance, setup, troubleshooting]
      when: every activated use
  executable_fixture: null
reconciliation:
  policy: conditional
  reason: CONCRETE-POLICY-REASON
  record: .roblox-resources/records/RESOURCE-SLUG.yaml
  learnings: .roblox-resources/learnings/
installation:
  # wally | pesde-wally (checks pesde.toml or, when absent, wally.toml) | pesde-registry |
  # pesde-git | npm | asset | custom. See references/resource-skill-contract.md.
  profile: pesde-wally
  dependency_section: dependencies
  registry: https://CANONICAL-REGISTRY
  target: roblox
  integrity:
    files:
      RELATIVE-SOURCE-FILE: REVIEWED-SHA256
